<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="24" y1="24" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
  </defs>
  <!-- Squircle Background -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="122" height="122" rx="27" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />

  <!-- Outer Steering Wheel Ring -->
  <circle cx="64" cy="64" r="38" stroke="url(#ringGrad)" stroke-width="10" />

  <!-- Steering Wheel Spokes -->
  <path d="M28 60 L54 64" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
  <path d="M100 60 L74 64" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
  <path d="M64 74 L64 100" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />

  <!-- Center Hub -->
  <circle cx="64" cy="64" r="12" fill="#FFFFFF" />
  <circle cx="64" cy="64" r="5" fill="#4F46E5" />

  <!-- Top Emerald Check / Signal Dot -->
  <circle cx="96" cy="32" r="9" fill="#10B981" stroke="#0F172A" stroke-width="3" />
</svg>
